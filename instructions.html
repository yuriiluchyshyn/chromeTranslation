<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>API Keys Guide</title>
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-ui);
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
    }
    .hero {
      background: var(--gradient-brand);
      color: var(--color-on-primary);
      padding: 40px 24px;
      text-align: center;
    }
    .hero h1 { margin: 0 0 8px 0; font-size: 26px; }
    .hero p { margin: 0; opacity: 0.9; font-size: var(--text-heading); }
    .wrap { max-width: 820px; margin: -24px auto 40px; padding: 0 20px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-default);
      box-shadow: var(--shadow-sm);
      padding: 28px 30px;
      margin-bottom: 22px;
    }
    .card h2 {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      font-size: 19px;
      margin: 0 0 var(--space-2) 0;
      color: var(--color-text);
    }
    .badge {
      display: inline-block;
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      margin-bottom: 16px;
    }
    .badge.required { background: #fdecea; color: var(--color-danger); }
    .badge.optional { background: var(--surface-tint); color: var(--color-info-text); }
    ol { padding-left: 22px; margin: 0; }
    ol li { margin-bottom: var(--space-4); }
    a { color: var(--color-primary); text-decoration: none; font-weight: var(--weight-medium); }
    a:hover { text-decoration: underline; }
    .note {
      background: var(--surface-tint);
      padding: var(--space-6) var(--space-7);
      border-radius: var(--radius-lg);
      font-size: var(--text-body);
      color: var(--color-info-text);
      margin-top: 18px;
    }
    .note.warn { background: #fef7e0; color: var(--color-warning-alt); }
    code {
      background: var(--surface-muted);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: var(--text-body);
    }
    .lang-bar { text-align: center; padding: 16px 0 0; }
    .lang-bar select {
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }
    .lang-bar select option { color: var(--color-text); }
  </style>
</head>
<body>
  <div class="hero">
    <h1 id="page-title">How to Get API Keys</h1>
    <p id="page-subtitle">Follow these steps to set up translation and reading.</p>
    <div class="lang-bar">
      <select id="uiLang">
        <option value="uk">Українська</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2><span>🔊</span> <span id="tts-title">Cloud Text-to-Speech API Key</span></h2>
      <span class="badge required" id="tts-badge">Required</span>
      <ol id="tts-steps"></ol>
      <div class="note warn" id="tts-note"></div>
    </div>

    <div class="card">
      <h2><span>✨</span> <span id="gemini-title">Gemini API Key</span></h2>
      <span class="badge optional" id="gemini-badge">Optional</span>
      <ol id="gemini-steps"></ol>
      <div class="note" id="gemini-note"></div>
    </div>
  </div>

  <script src="instructions.js"></script>
</body>
</html>
