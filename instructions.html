<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>API Keys Guide</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: #f8f9fa;
      color: #1c1e21;
      line-height: 1.6;
    }
    .hero {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 40px 24px;
      text-align: center;
    }
    .hero h1 { margin: 0 0 8px 0; font-size: 26px; }
    .hero p { margin: 0; opacity: 0.9; font-size: 15px; }
    .wrap { max-width: 820px; margin: -24px auto 40px; padding: 0 20px; }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      padding: 28px 30px;
      margin-bottom: 22px;
    }
    .card h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      margin: 0 0 6px 0;
      color: #1a1a2e;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .badge.required { background: #fdecea; color: #b3261e; }
    .badge.optional { background: #e8f0fe; color: #1558d6; }
    ol { padding-left: 22px; margin: 0; }
    ol li { margin-bottom: 10px; }
    a { color: #1a73e8; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .note {
      background: #e8f0fe;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 13px;
      color: #1558d6;
      margin-top: 18px;
    }
    .note.warn { background: #fef7e0; color: #a56300; }
    code {
      background: #f1f3f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 13px;
    }
    .lang-bar { text-align: center; padding: 16px 0 0; }
    .lang-bar select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }
    .lang-bar select option { color: #1c1e21; }
  </style>
</head>
<body>
  <div class="hero">
    <h1 id="page-title">How to Get API Keys</h1>
    <p id="page-subtitle">Follow these steps to set up translation and reading.</p>
    <div class="lang-bar">
      <select id="uiLang">
        <option value="uk">Українська</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2><span>🔊</span> <span id="tts-title">Cloud Text-to-Speech API Key</span></h2>
      <span class="badge required" id="tts-badge">Required</span>
      <ol id="tts-steps"></ol>
      <div class="note warn" id="tts-note"></div>
    </div>

    <div class="card">
      <h2><span>✨</span> <span id="gemini-title">Gemini API Key</span></h2>
      <span class="badge optional" id="gemini-badge">Optional</span>
      <ol id="gemini-steps"></ol>
      <div class="note" id="gemini-note"></div>
    </div>
  </div>

  <script src="instructions.js"></script>
</body>
</html>
