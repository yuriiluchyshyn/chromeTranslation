<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    body { font-family: var(--font-ui); padding: 40px; background: var(--color-bg); color: var(--color-text); display: flex; justify-content: center; }
    .container { display: flex; gap: 30px; width: 100%; max-width: 520px; }
    .card { background: var(--surface); padding: 30px; border-radius: var(--radius-xl); border: 1px solid var(--border-default); box-shadow: var(--shadow-sm); }
    .main-card { flex: 1; }
    h2 { margin: -30px -30px 24px; padding: 18px 30px; font-size: var(--text-title); font-weight: var(--weight-semibold); background: var(--gradient-brand); color: var(--color-on-primary); border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
    .field { margin-bottom: 20px; }
    label { display: block; font-weight: var(--weight-semibold); margin-bottom: var(--space-3); font-size: var(--text-sm); color: var(--color-text-subtle); }
    select, input { width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-sizing: border-box; outline: none; font-size: 12.5px; color: var(--color-text); transition: var(--transition-base); }
    select:focus, input:focus { border-color: var(--color-primary); }
    button { background: var(--gradient-brand); color: var(--color-on-primary); border: none; padding: var(--space-5) 24px; border-radius: var(--radius-md); cursor: pointer; font-weight: var(--weight-semibold); width: 100%; font-size: 12.5px; transition: var(--transition-base); }
    button:hover { box-shadow: var(--shadow-md); }
    button.secondary { background: var(--surface); color: var(--color-primary); border: 1px solid var(--color-primary); padding: var(--space-3) var(--space-6); font-size: var(--text-body); width: auto; margin-top: var(--space-3); }
    button.secondary:hover { box-shadow: none; background: var(--color-primary-tint-08); }
    button.secondary:disabled { opacity: .5; cursor: default; background: var(--surface); box-shadow: none; }
    .field-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
    .field-head label { margin-bottom: 0; }
    .info-btn { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; padding: 0; border: none; background: none; color: var(--color-text-muted); cursor: pointer; line-height: 0; }
    .info-btn:hover { color: var(--color-primary); }
    .input-wrap { position: relative; }
    .input-wrap input { width: 100%; padding-right: 38px; }
    .eye-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: none; background: none; color: var(--color-text-muted); cursor: pointer; border-radius: var(--radius-md); line-height: 0; }
    .eye-btn:hover { color: var(--color-text-secondary); background: var(--surface-muted); }
    .model-row { display: flex; gap: var(--space-3); align-items: stretch; }
    .model-row select { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: var(--text-sm); }
    #model-hint { font-size: var(--text-sm); color: var(--color-text-muted); margin-top: var(--space-2); line-height: 1.4; }
    #model-hint.error { color: var(--color-danger); }
    #status { margin-top: 15px; text-align: center; color: var(--color-success-text); font-weight: bold; display: none; }
    .help-row { background: var(--surface-tint); padding: var(--space-6) var(--space-7); border-radius: var(--radius-lg); font-size: var(--text-body); color: var(--color-info-text); margin-bottom: 20px; display: flex; flex-direction: column; gap: var(--space-2); }
    .help-row a { color: var(--color-primary); text-decoration: none; font-weight: var(--weight-semibold); }
    .help-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card main-card">
      <h2 id="title">Settings</h2>
      <div class="field">
        <label id="l-ui">Extension Language:</label>
        <select id="uiLang">
          <option value="uk">Українська</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <div class="field">
        <label id="l-def">Default Translation Language:</label>
        <select id="defLang">
          <option value="uk">Українська</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="pl">Polski</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
        </select>
      </div>
      <div class="field">
        <div class="field-head">
          <label id="l-key-gemini">Gemini API Key (AI translation + reading):</label>
          <button id="infoGeminiKey" class="info-btn" type="button" title="How to get this key" aria-label="How to get this key">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
        </div>
        <div class="input-wrap">
          <input type="password" id="geminiKey" placeholder="AIza...">
          <button id="toggleGeminiKey" class="eye-btn" type="button" aria-label="Show or hide key"></button>
        </div>
      </div>
      <div class="field">
        <div class="field-head">
          <label id="l-key-cloud">Cloud Text-to-Speech API Key (traditional reading):</label>
          <button id="infoCloudKey" class="info-btn" type="button" title="How to get this key" aria-label="How to get this key">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
        </div>
        <div class="input-wrap">
          <input type="password" id="cloudTtsKey" placeholder="AIza...">
          <button id="toggleCloudKey" class="eye-btn" type="button" aria-label="Show or hide key"></button>
        </div>
      </div>
      <div class="field">
        <label id="l-model">Translation Model (Gemini):</label>
        <div class="model-row">
          <select id="aiModel">
            <option value="">— auto —</option>
          </select>
        </div>
        <button id="loadModels" class="secondary" type="button">Load available models</button>
        <div id="model-hint"></div>
      </div>
      <div class="help-row">
        <span id="help-text">Need help getting your API keys?</span>
        <a href="#" id="openInstructions">Open the step-by-step guide →</a>
      </div>
      <button id="save">Save</button>
      <div id="status">Saved!</div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
