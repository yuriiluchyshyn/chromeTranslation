<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    body { width: 280px; padding: 16px; font-family: var(--font-ui); color: var(--color-text); margin: 0; background: var(--surface); }
    .popup-container { display: flex; flex-direction: column; gap: 16px; }
    .header-section { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 16px; font-weight: var(--weight-bold); margin: 0; letter-spacing: -0.2px; color: var(--color-text); }
    .switch { position: relative; width: 42px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-default); transition: var(--transition-toggle-track); border-radius: var(--radius-pill); }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: #fff; transition: var(--transition-toggle-knob); border-radius: var(--radius-circle); }
    input:checked + .slider { background-color: var(--color-success-on); }
    input:checked + .slider:before { transform: translateX(20px); }
    .translation-section { display: flex; flex-direction: column; gap: var(--space-2); }
    .sub-label { font-size: var(--text-sm); color: var(--color-text-muted); font-weight: var(--weight-medium); }
    .language-picker { display: flex; align-items: center; gap: var(--space-2); }
    .select-wrapper { position: relative; flex: 1; min-width: 0; }
    select { width: 100%; padding: var(--space-3) 24px var(--space-3) var(--space-4); border-radius: var(--radius-lg); border: 1px solid var(--border-strong); font-size: var(--text-body); font-weight: var(--weight-medium); outline: none; background: var(--surface); color: var(--color-text); appearance: none; cursor: pointer; text-overflow: ellipsis; transition: var(--transition-base); }
    select:focus { border-color: var(--color-primary); }
    .select-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: var(--text-micro); color: var(--color-text-muted); pointer-events: none; }
    #pdf-alert { display: none; background: var(--surface-tint); color: var(--color-info-text); padding: var(--space-5); border-radius: var(--radius-xl); font-size: var(--text-body); border: 1px solid var(--border-tint); text-align: center; margin-top: var(--space-4); }
    .btn-primary { background: var(--color-primary); color: var(--color-on-primary); border: none; padding: var(--space-4); border-radius: var(--radius-lg); cursor: pointer; font-weight: var(--weight-semibold); width: 100%; margin-top: var(--space-1); font-size: var(--text-body); transition: var(--transition-base); }
    .btn-primary:hover { box-shadow: var(--shadow-md); }
    .divider { height: 1px; background: var(--border-default); border: none; margin: 0; }
    .ai-fields { display: flex; flex-direction: column; gap: var(--space-4); }
    .ai-fields.hidden { display: none; }
    .ai-textarea { width: 100%; box-sizing: border-box; padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); border: 1px solid var(--border-strong); font-size: var(--text-sm); font-family: inherit; outline: none; resize: vertical; min-height: 44px; line-height: 1.4; color: var(--color-text); }
    .ai-textarea:focus { border-color: var(--color-primary); }
    .hint-text { font-size: var(--text-meta); color: var(--color-text-muted); line-height: 1.3; }
    .ai-status { display: none; font-size: var(--text-sm); line-height: 1.4; padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); }
    .ai-status.show { display: block; }
    .ai-status.error { background: #fdecea; color: var(--color-danger); border: 1px solid #f7c9c4; }
    .ai-status.ok { background: #e6f4ea; color: var(--color-success-text); border: 1px solid #bfe3c9; }
    #page-warning { display: none; background: #fdecea; color: var(--color-danger); padding: var(--space-4) var(--space-5); border-radius: var(--radius-xl); font-size: var(--text-sm); line-height: 1.4; border: 1px solid #f7c9c4; }
    #page-warning a { color: var(--color-danger); font-weight: var(--weight-bold); text-decoration: underline; cursor: pointer; }
    #tts-key-warning { display: none; background: #fef7e0; color: var(--color-warning-alt); padding: var(--space-4) var(--space-5); border-radius: var(--radius-xl); font-size: var(--text-sm); line-height: 1.4; border: 1px solid #fce8b2; }
    #tts-key-warning a { color: var(--color-warning-alt); font-weight: var(--weight-bold); text-decoration: underline; cursor: pointer; }
    #ai-key-hint { display: none; background: #fef7e0; color: var(--color-warning-alt); padding: var(--space-4) var(--space-5); border-radius: var(--radius-xl); font-size: var(--text-sm); line-height: 1.4; border: 1px solid #fce8b2; }
    #ai-key-hint a { color: var(--color-warning-alt); font-weight: var(--weight-bold); text-decoration: underline; cursor: pointer; }
    .ai-toggle-disabled { opacity: 0.5; }
    input:disabled + .slider { cursor: not-allowed; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header-section">
      <h1 class="title">Перекладач</h1>
      <label class="switch">
        <input type="checkbox" id="toggle-translator" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div id="page-warning">
      <span id="page-warning-text"></span>
      <a id="page-warning-link"></a>
    </div>
    <div id="tts-key-warning">
      <span id="tts-key-warning-text"></span>
      <a id="tts-key-warning-link"></a>
    </div>
    <div class="translation-section">
      <span class="sub-label">Напрямок перекладу:</span>
      <div class="language-picker">
        <div class="select-wrapper">
          <select id="lang-from">
            <option value="auto">Автовизначення</option>
            <option value="en">English</option>
            <option value="uk">Українська</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="pl">Polski</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh">中文</option>
          </select>
          <span class="select-icon">▼</span>
        </div>
        <span style="color: #bcc0c4;">→</span>
        <div class="select-wrapper">
          <select id="lang-to">
            <option value="uk">Українська</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="pl">Polski</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh">中文</option>
          </select>
          <span class="select-icon">▼</span>
        </div>
      </div>
    </div>
    <div class="translation-section">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="show-hints" checked style="margin: 0;">
        <span class="sub-label" style="margin: 0;">Показувати переклад над текстом</span>
      </label>
    </div>
    <hr class="divider">
    <div class="translation-section">
      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <span class="sub-label" id="ai-label" style="margin: 0;">AI-переклад (Gemini)</span>
        <span class="switch" style="flex: none;">
          <input type="checkbox" id="ai-enabled">
          <span class="slider"></span>
        </span>
      </label>
    </div>
    <div class="translation-section">
      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <span class="sub-label" id="ai-reading-label" style="margin: 0;">AI-читання (Gemini)</span>
        <span class="switch" style="flex: none;">
          <input type="checkbox" id="ai-reading-enabled">
          <span class="slider"></span>
        </span>
      </label>
    </div>
    <div id="ai-key-hint">
      <span id="ai-key-hint-text"></span>
      <a id="ai-key-hint-link"></a>
    </div>
    <div class="ai-fields hidden" id="ai-fields">
      <div class="ai-status" id="ai-status"></div>
      <div class="translation-section">
        <span class="sub-label" id="ai-style-label">Стиль перекладу:</span>
        <div class="select-wrapper">
          <select id="ai-style">
            <option value="standard">Стандартний</option>
            <option value="software_engineer">Software Engineer</option>
            <option value="solution_architect">Solution Architect</option>
          </select>
          <span class="select-icon">▼</span>
        </div>
      </div>
      <div class="translation-section" id="ai-prompt-section">
        <span class="sub-label" id="ai-prompt-label">Інструкція для перекладу:</span>
        <textarea class="ai-textarea" id="ai-prompt" rows="3" placeholder="Напр.: Ти перекладаєш технічну літературу для solution architect. Зберігай точність термінів."></textarea>
      </div>
      <span class="hint-text" id="ai-hint">Використовує Google API-ключ із налаштувань. Якщо ключ не задано або сталася помилка — переклад виконає Google Translate.</span>
    </div>
    <div id="pdf-alert">
      <span style="font-weight:700; display:block; margin-bottom:5px;" id="pdf-title">📄 PDF Detected</span>
      <button class="btn-primary" id="open-current-pdf">Open Reader</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
