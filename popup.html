<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; padding: 16px; font-family: system-ui, -apple-system, sans-serif; color: #1c1e21; margin: 0; }
    .popup-container { display: flex; flex-direction: column; gap: 16px; }
    .header-section { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }
    .switch { position: relative; width: 42px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e4e6eb; transition: .3s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #007bff; }
    input:checked + .slider:before { transform: translateX(20px); }
    .translation-section { display: flex; flex-direction: column; gap: 6px; }
    .sub-label { font-size: 12px; color: #8a8d91; font-weight: 500; }
    .language-picker { display: flex; align-items: center; gap: 6px; }
    .select-wrapper { position: relative; flex: 1; min-width: 0; }
    select { width: 100%; padding: 8px 24px 8px 10px; border-radius: 8px; border: 1px solid #dddfe2; font-size: 13px; font-weight: 500; outline: none; background: #fff; appearance: none; cursor: pointer; text-overflow: ellipsis; }
    .select-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #8c939d; pointer-events: none; }
    #pdf-alert { display: none; background: #f0f7ff; color: #0056b3; padding: 12px; border-radius: 12px; font-size: 13px; border: 1px solid #d0e5ff; text-align: center; margin-top: 10px; }
    .btn-primary { background: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 5px; font-size: 13px; }
    .divider { height: 1px; background: #e4e6eb; border: none; margin: 0; }
    .ai-fields { display: flex; flex-direction: column; gap: 10px; }
    .ai-fields.hidden { display: none; }
    .ai-textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid #dddfe2; font-size: 12px; font-family: inherit; outline: none; resize: vertical; min-height: 44px; line-height: 1.4; }
    .ai-textarea:focus { border-color: #007bff; }
    .hint-text { font-size: 11px; color: #b0b3b8; line-height: 1.3; }
    .ai-status { display: none; font-size: 12px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; }
    .ai-status.show { display: block; }
    .ai-status.error { background: #fdecea; color: #b3261e; border: 1px solid #f7c9c4; }
    .ai-status.ok { background: #e6f4ea; color: #1e7e34; border: 1px solid #bfe3c9; }
    #page-warning { display: none; background: #fdecea; color: #b3261e; padding: 10px 12px; border-radius: 10px; font-size: 12px; line-height: 1.4; border: 1px solid #f7c9c4; }
    #page-warning a { color: #b3261e; font-weight: 700; text-decoration: underline; cursor: pointer; }
    #tts-key-warning { display: none; background: #fef7e0; color: #a56300; padding: 10px 12px; border-radius: 10px; font-size: 12px; line-height: 1.4; border: 1px solid #fce8b2; }
    #tts-key-warning a { color: #a56300; font-weight: 700; text-decoration: underline; cursor: pointer; }
    #ai-key-hint { display: none; background: #fef7e0; color: #a56300; padding: 10px 12px; border-radius: 10px; font-size: 12px; line-height: 1.4; border: 1px solid #fce8b2; }
    #ai-key-hint a { color: #a56300; font-weight: 700; text-decoration: underline; cursor: pointer; }
    .ai-toggle-disabled { opacity: 0.5; }
    input:disabled + .slider { cursor: not-allowed; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header-section">
      <h1 class="title">Перекладач</h1>
      <label class="switch">
        <input type="checkbox" id="toggle-translator" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div id="page-warning">
      <span id="page-warning-text"></span>
      <a id="page-warning-link"></a>
    </div>
    <div id="tts-key-warning">
      <span id="tts-key-warning-text"></span>
      <a id="tts-key-warning-link"></a>
    </div>
    <div class="translation-section">
      <span class="sub-label">Напрямок перекладу:</span>
      <div class="language-picker">
        <div class="select-wrapper">
          <select id="lang-from">
            <option value="auto">Автовизначення</option>
            <option value="en">English</option>
            <option value="uk">Українська</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="pl">Polski</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh">中文</option>
          </select>
          <span class="select-icon">▼</span>
        </div>
        <span style="color: #bcc0c4;">→</span>
        <div class="select-wrapper">
          <select id="lang-to">
            <option value="uk">Українська</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="pl">Polski</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh">中文</option>
          </select>
          <span class="select-icon">▼</span>
        </div>
      </div>
    </div>
    <div class="translation-section">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="show-hints" checked style="margin: 0;">
        <span class="sub-label" style="margin: 0;">Показувати переклад над текстом</span>
      </label>
    </div>
    <hr class="divider">
    <div class="translation-section">
      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <span class="sub-label" id="ai-label" style="margin: 0;">AI-переклад (Gemini)</span>
        <span class="switch" style="flex: none;">
          <input type="checkbox" id="ai-enabled">
          <span class="slider"></span>
        </span>
      </label>
    </div>
    <div class="translation-section">
      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <span class="sub-label" id="ai-reading-label" style="margin: 0;">AI-читання (Gemini)</span>
        <span class="switch" style="flex: none;">
          <input type="checkbox" id="ai-reading-enabled">
          <span class="slider"></span>
        </span>
      </label>
    </div>
    <div id="ai-key-hint">
      <span id="ai-key-hint-text"></span>
      <a id="ai-key-hint-link"></a>
    </div>
    <div class="ai-fields hidden" id="ai-fields">
      <div class="ai-status" id="ai-status"></div>
      <div class="translation-section">
        <span class="sub-label" id="ai-style-label">Стиль перекладу:</span>
        <div class="select-wrapper">
          <select id="ai-style">
            <option value="standard">Стандартний</option>
            <option value="software_engineer">Software Engineer</option>
            <option value="solution_architect">Solution Architect</option>
          </select>
          <span class="select-icon">▼</span>
        </div>
      </div>
      <div class="translation-section" id="ai-prompt-section">
        <span class="sub-label" id="ai-prompt-label">Інструкція для перекладу:</span>
        <textarea class="ai-textarea" id="ai-prompt" rows="3" placeholder="Напр.: Ти перекладаєш технічну літературу для solution architect. Зберігай точність термінів."></textarea>
      </div>
      <span class="hint-text" id="ai-hint">Використовує Google API-ключ із налаштувань. Якщо ключ не задано або сталася помилка — переклад виконає Google Translate.</span>
    </div>
    <div id="pdf-alert">
      <span style="font-weight:700; display:block; margin-bottom:5px;" id="pdf-title">📄 PDF Detected</span>
      <button class="btn-primary" id="open-current-pdf">Open Reader</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
